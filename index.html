<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorting Algorithm Visualizer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111827;
      color: white;
      margin: 0;
      padding: 30px 15px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #9ca3af;
    }

    .controls {
      margin: 25px 0;
    }

    button {
      padding: 10px 16px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #array {
      height: 350px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      max-width: 900px;
      margin: auto;
    }

    .bar {
      width: 12px;
      background: #60a5fa;
      border-radius: 4px 4px 0 0;
    }
  </style>
</head>

<body>

  <h1>Sorting Algorithm Visualizer</h1>
  <p>Watch sorting algorithms work step by step.</p>

  <div class="controls">
    <button onclick="generateArray()">New Array</button>
    <button onclick="bubbleSort()">Bubble Sort</button>
  </div>

  <div id="array"></div>

  <script>
    let values = [];

    function generateArray() {
      values = [];

      for (let i = 0; i < 40; i++) {
        values.push(Math.floor(Math.random() * 300) + 20);
      }

      drawArray();
    }

    function drawArray() {
      const container = document.getElementById("array");
      container.innerHTML = "";

      values.forEach(value => {
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.height = value + "px";
        container.appendChild(bar);
      });
    }

    async function bubbleSort() {
      for (let i = 0; i < values.length; i++) {

        for (let j = 0; j < values.length - i - 1; j++) {

          if (values[j] > values[j + 1]) {

            let temp = values[j];
            values[j] = values[j + 1];
            values[j + 1] = temp;

            drawArray();

            await new Promise(resolve =>
              setTimeout(resolve, 30)
            );
          }
        }
      }
    }

    generateArray();
  </script>

</body>
</html>
